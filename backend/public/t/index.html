<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Open in SmartCart</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #101311; color: #f7faf7; }
    main { width: min(88vw, 26rem); text-align: center; }
    img { width: 6rem; height: 6rem; border-radius: 1.35rem; box-shadow: 0 16px 38px #0008; }
    h1 { margin: 1.25rem 0 .5rem; font-size: 1.8rem; }
    p { margin: 0 0 1.5rem; color: #b8c0ba; line-height: 1.45; }
    small { display: block; margin-top: 1rem; color: #879089; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <img src="/t/smartcart-icon.png" alt="SmartCart app icon">
    <h1>SmartCart handoff</h1>
    <p>Open this private link on an iPhone with SmartCart installed.</p>
    <small>If SmartCart did not open, return to the message, press and hold the original link, then choose Open in SmartCart. The link expires shortly.</small>
  </main>
</body>
</html>
