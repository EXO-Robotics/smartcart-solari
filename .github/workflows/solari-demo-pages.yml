name: Deploy Solari submission demo

on:
  push:
    branches: [main]
    paths:
      - "website/solari-demo/**"
      - "contracts/fixtures/v1/solari/**"
      - ".github/workflows/solari-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solari-demo-pages
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the replay UI and controlled retailer surface
        run: |
          python3 website/solari-demo/validate.py
          python3 -m unittest discover -s website/solari-demo/tests -v
          node --check website/solari-demo/app.js
          node --check website/solari-demo/retailer/retailer.js

      - name: Build a minimal Pages artifact
        run: |
          mkdir -p _site/website _site/contracts/fixtures/v1
          cp -R website/solari-demo _site/website/solari-demo
          cp -R contracts/fixtures/v1/solari _site/contracts/fixtures/v1/solari

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}website/solari-demo/
    runs-on: ubuntu-latest
    needs: verify-and-package
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
