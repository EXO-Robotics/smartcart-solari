name: Deploy Solari submission case study

on:
  push:
    branches: [main]
    paths:
      - "website/solari-case-study/**"
      - "website/solari-demo/**"
      - "contracts/fixtures/v1/solari/**"
      - "evidence/live/**"
      - ".github/workflows/solari-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solari-demo-pages
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the case study, replay UI, and controlled retailer surface
        run: |
          python3 website/solari-case-study/validate.py
          python3 -m unittest discover -s website/solari-case-study/tests -v
          node --check website/solari-case-study/script.js
          python3 website/solari-demo/validate.py
          python3 -m unittest discover -s website/solari-demo/tests -v
          node --check website/solari-demo/app.js
          node --check website/solari-demo/retailer/retailer.js

      - name: Build the Pages case-study artifact
        run: |
          mkdir -p _site/website _site/contracts/fixtures/v1 _site/evidence
          cp website/solari-case-study/index.html _site/index.html
          cp website/solari-case-study/styles.css _site/styles.css
          cp website/solari-case-study/script.js _site/script.js
          cp -R website/solari-case-study/assets _site/assets
          cp -R website/solari-demo _site/website/solari-demo
          cp -R contracts/fixtures/v1/solari _site/contracts/fixtures/v1/solari
          cp -R evidence/live _site/evidence/live

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-package
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
